name: Frontend UI QA

on:
  pull_request:
    paths:
      - "src/api/authPublic.ts"
      - "src/**"
      - "scripts/**"
      - "contracts/ui-ux-*.json"
      - "design-system/bega/**"
      - ".agents/skills/ui-ux-pro-max/**"
      - "docs/VISUAL_QA.md"
      - "visual-qa-harness.html"
      - "vite.visual-qa.config.ts"
      - "src/api/authPublic.test.ts"
      - "src/api/publicClient.ts"
      - "src/components/auth/AuthLayout.tsx"
      - "src/components/AppRoutes.tsx"
      - "src/components/Login.tsx"
      - "src/components/SignUp.tsx"
      - "src/components/PasswordReset.tsx"
      - "src/components/PasswordResetConfirm.tsx"
      - "src/components/AccountDeletionRecovery.tsx"
      - "src/components/ui/auth-primitives.tsx"
      - "src/components/ui/button.tsx"
      - "src/components/ui/input.tsx"
      - "src/components/ui/select.tsx"
      - "src/components/ui/label.tsx"
      - "src/hooks/useSignUpForm.ts"
      - "src/index.css"
      - "src/types/auth.ts"
      - "src/utils/loginRedirect.ts"
      - "src/utils/validation.ts"
      - "cypress/e2e/auth*.cy.ts"
      - "cypress/e2e/stadium.cy.ts"
      - "cypress/e2e/chatbot*.cy.ts"
      - "cypress/support/**"
      - "cypress.config.ts"
      - "scripts/auth-qa.mjs"
      - "scripts/frontend-ui-impact.mjs"
      - "scripts/frontend-ui-impact.test.ts"
      - "scripts/cypress-run.mjs"
      - "scripts/landing-qa.mjs"
      - "scripts/landing-first-load-audit.mjs"
      - "scripts/uiux-*.mjs"
      - "scripts/uiux-*.test.mjs"
      - "scripts/visual-qa-design-intent.mjs"
      - "scripts/visual-qa-design-intent.test.mjs"
      - "scripts/visual-qa-harness-smoke.ts"
      - "scripts/visual-qa-harness-smoke.test.ts"
      - "scripts/test-e2e.mjs"
      - "src/assets/landing/**"
      - "src/components/Landing.tsx"
      - "src/components/ThemeToggleButton.tsx"
      - "src/components/ViewportDeferred.tsx"
      - "src/components/common/OptimizedImage.tsx"
      - "src/components/icons/FirstLoadIcons.tsx"
      - "src/components/ui/card.tsx"
      - "src/hooks/useLandingScroll.ts"
      - "src/components/StadiumGuide.tsx"
      - "src/hooks/useStadiumGuide.ts"
      - "src/hooks/useKakaoMap.ts"
      - "src/utils/kakaoMap.ts"
      - "src/utils/stadiumGuideUtils.ts"
      - "src/types/stadium.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/_frontend-node-suite.yml"
      - ".github/workflows/frontend-ui-qa.yml"
  workflow_dispatch:
    inputs:
      suite:
        description: "UI suite to run"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - auth
          - landing
          - stadium
          - chatbot
          - pages
          - design-intent

concurrency:
  group: frontend-ui-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      auth_changed: ${{ steps.detect.outputs.auth_changed }}
      landing_changed: ${{ steps.detect.outputs.landing_changed }}
      stadium_changed: ${{ steps.detect.outputs.stadium_changed }}
      chatbot_changed: ${{ steps.chatbot.outputs.chatbot_changed }}
      pages_changed: ${{ steps.detect.outputs.pages_changed }}
      design_intent_changed: ${{ steps.detect.outputs.design_intent_changed }}
      design_intent_profiles: ${{ steps.detect.outputs.design_intent_profiles }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect impacted UI suites
        id: detect
        shell: bash
        env:
          SUITE_INPUT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.suite || 'all' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          CHANGED_FILE_LIST="$(mktemp)"
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            git fetch --no-tags --prune --depth=1 origin "${BASE_SHA}" "${HEAD_SHA}" || true
            git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" > "${CHANGED_FILE_LIST}"
          fi

          node scripts/frontend-ui-impact.mjs \
            --changed-file="${CHANGED_FILE_LIST}"

      - name: Detect chatbot E2E impact
        id: chatbot
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            echo "chatbot_changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          git fetch --no-tags --prune --depth=1 origin "${BASE_SHA}" "${HEAD_SHA}" || true
          CHANGED_FILES="$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")"
          if grep -qE '^(cypress/e2e/chatbot[^/]*\.cy\.ts|cypress/support/|cypress\.config\.ts|scripts/(test-e2e|qa-presets)\.mjs|src/components/ChatBot|src/components/chatbot/|src/components/AuthenticatedLayoutChrome\.tsx|src/hooks/useChatBot|src/api/(sse|stream)\.ts|package\.json$)' <<< "${CHANGED_FILES}"; then
            echo "chatbot_changed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "chatbot_changed=false" >> "${GITHUB_OUTPUT}"
          fi

  pages-qa:
    needs: detect-changes
    if: ${{ (github.event_name == 'pull_request' && needs.detect-changes.outputs.pages_changed == 'true') || (github.event_name == 'workflow_dispatch' && (github.event.inputs.suite == 'pages' || github.event.inputs.suite == 'all')) }}
    uses: ./.github/workflows/_frontend-node-suite.yml
    permissions:
      contents: read
    with:
      timeout_minutes: 20
      env_exports: |
        VITE_SITE_URL=http://127.0.0.1:5176
        VITE_API_BASE_URL=/api
        VITE_AI_EVENT_VERSION=1
        VITE_MATE_REQUIRE_SOCIAL_VERIFICATION=false
        VITE_GA4_MEASUREMENT_ID=G-CI00000000
        VITE_GOOGLE_SITE_VERIFICATION=ciGoogleVerificationToken2026
        VITE_NAVER_SITE_VERIFICATION=ciNaverVerificationToken2026
        VITE_KAKAO_MAP_KEY=ciKakaoMapKey
      run_script: npm run build
      summary_script: |
        echo "### Frontend Pages Build QA" >> "${GITHUB_STEP_SUMMARY}"
        echo "- Generic source/build impact detected." >> "${GITHUB_STEP_SUMMARY}"
      artifact_name: frontend-pages-build-artifacts
      artifact_paths: |
        dist/**

  frontend-unit:
    needs: detect-changes
    uses: ./.github/workflows/_frontend-node-suite.yml
    permissions:
      contents: read
    with:
      timeout_minutes: 25
      install_playwright: true
      checkout_backend: true
      env_exports: |
        BEGA_BACKEND_ROOT=backend
      run_script: |
        npm run test:unit
        npm run visual-qa:contract:test
        npm run visual-qa:contract:check
        npm run visual-qa:inventory:test
        npm run visual-qa:inventory:check
        npm run visual-qa:states:test
        npm run visual-qa:states
        npm run visual-qa:harness:test
        npm run uiux:policy:test
        npm run uiux:policy:check
        npm run uiux:recommend:test
        npm run uiux:impact:test
        npm run uiux:design-intent:test
        npm run uiux:upgrade-review:test
      summary_script: |
        echo "### Frontend Unit Tests" >> "${GITHUB_STEP_SUMMARY}"
        echo "- TypeScript and TSX unit suites: passed" >> "${GITHUB_STEP_SUMMARY}"
        echo "- Visual QA contracts and detectors: passed" >> "${GITHUB_STEP_SUMMARY}"
        echo "- UI UX Design Intent policy and routing: passed" >> "${GITHUB_STEP_SUMMARY}"

  design-intent-qa:
    needs: detect-changes
    if: ${{ (github.event_name == 'pull_request' && needs.detect-changes.outputs.design_intent_changed == 'true') || (github.event_name == 'workflow_dispatch' && (github.event.inputs.suite == 'design-intent' || github.event.inputs.suite == 'all')) }}
    uses: ./.github/workflows/_frontend-node-suite.yml
    permissions:
      contents: read
    with:
      timeout_minutes: 30
      install_playwright: true
      env_exports: |
        UI_UX_PROFILES=${{ needs.detect-changes.outputs.design_intent_profiles }}
        VITE_SITE_URL=http://127.0.0.1:5176
        VITE_API_BASE_URL=/api
        VITE_MATE_REQUIRE_SOCIAL_VERIFICATION=false
        VITE_GA4_MEASUREMENT_ID=G-CI00000000
        VITE_GOOGLE_SITE_VERIFICATION=ciGoogleVerificationToken2026
        VITE_NAVER_SITE_VERIFICATION=ciNaverVerificationToken2026
        VITE_KAKAO_MAP_KEY=ciKakaoMapKey
      run_script: |
        npm run uiux:policy:check
        node --import tsx scripts/visual-qa-design-intent.mjs --plan --profiles="${UI_UX_PROFILES}"
        VISUAL_QA_HARNESS_COMPONENT_IDS="$(node -e "const p=require('./reports/ui-ux-design-intent-plan.json'); process.stdout.write(p.scenarios.map(s => s.id).join(','))")"
        export VISUAL_QA_HARNESS_COMPONENT_IDS
        export VISUAL_QA_HARNESS_SCOPE=component-states
        export VISUAL_QA_HARNESS_REPORT=reports/ui-ux-design-intent-harness.json
        export VISUAL_QA_HARNESS_SCREENSHOTS_DIR=reports/ui-ux-design-intent-screenshots
        export VISUAL_QA_HARNESS_CONCURRENCY=4
        HARNESS_STATUS=0
        set +e
        npx start-server-and-test "npm run visual-qa:harness:dev" http://127.0.0.1:5182/visual-qa-harness.html "node --import tsx scripts/visual-qa-harness-smoke.ts"
        HARNESS_STATUS=$?
        set -e
        if [[ ! -f "reports/ui-ux-design-intent-harness.json" ]]; then
          node - <<'NODE'
          const fs = require('node:fs');
          fs.mkdirSync('reports', { recursive: true });
          fs.writeFileSync('reports/ui-ux-design-intent-harness.json', JSON.stringify({
            summary: { ok: false, passed: 0, failed: 1, total: 0 },
            results: [],
          }, null, 2));
          NODE
        fi
        AUDIT_STATUS=0
        set +e
        node --import tsx scripts/visual-qa-design-intent.mjs --finalize
        AUDIT_STATUS=$?
        set -e
        if [[ "${HARNESS_STATUS}" -ne 0 || "${AUDIT_STATUS}" -ne 0 ]]; then exit 1; fi
      summary_script: |
        echo "### UI UX Design Intent Browser Audit" >> "${GITHUB_STEP_SUMMARY}"
        if [[ -f "reports/ui-ux-design-intent-audit.json" ]]; then
          node --import tsx scripts/visual-qa-design-intent.mjs --summary \
            --audit=reports/ui-ux-design-intent-audit.json \
            --upgrade-review=reports/ui-ux-pro-max-upgrade-review.json \
            >> "${GITHUB_STEP_SUMMARY}"
        else
          echo "Audit report was not generated" >> "${GITHUB_STEP_SUMMARY}"
        fi
      artifact_name: frontend-ui-ux-design-intent-artifacts
      artifact_paths: |
        reports/ui-ux-design-intent-plan.json
        reports/ui-ux-design-intent-harness.json
        reports/ui-ux-design-intent-audit.json
        reports/ui-ux-design-intent-audit.md
        reports/ui-ux-design-intent-screenshots/**

  auth-qa:
    needs: detect-changes
    if: ${{ (github.event_name == 'pull_request' && needs.detect-changes.outputs.auth_changed == 'true') || (github.event_name == 'workflow_dispatch' && (github.event.inputs.suite == 'auth' || github.event.inputs.suite == 'all')) }}
    uses: ./.github/workflows/_frontend-node-suite.yml
    permissions:
      contents: read
    with:
      timeout_minutes: 30
      env_exports: |
        VITE_SITE_URL=http://127.0.0.1:5176
        VITE_API_BASE_URL=/api
        VITE_MATE_REQUIRE_SOCIAL_VERIFICATION=false
        VITE_GA4_MEASUREMENT_ID=G-CI00000000
        VITE_GOOGLE_SITE_VERIFICATION=ciGoogleVerificationToken2026
        VITE_NAVER_SITE_VERIFICATION=ciNaverVerificationToken2026
        VITE_KAKAO_MAP_KEY=ciKakaoMapKey
      run_script: |
        npm run qa:auth
        AUTH_E2E_OUTCOME="success"
        if ! npm run test:e2e:auth:dev; then
          AUTH_E2E_OUTCOME="failure"
        fi
        echo "AUTH_E2E_OUTCOME=${AUTH_E2E_OUTCOME}" >> "${GITHUB_ENV}"
        if [[ "${AUTH_E2E_OUTCOME}" != "success" ]]; then
          exit 1
        fi
      summary_script: |
        echo "### Frontend Auth QA" >> "${GITHUB_STEP_SUMMARY}"
        echo "- Auth E2E smoke: ${AUTH_E2E_OUTCOME:-skipped}" >> "${GITHUB_STEP_SUMMARY}"
        if [[ -f "output/auth-qa/auth-summary.md" ]]; then
          cat "output/auth-qa/auth-summary.md" >> "${GITHUB_STEP_SUMMARY}"
        elif [[ -f "output/auth-qa/auth-report.json" ]]; then
          node - <<'NODE' >> "${GITHUB_STEP_SUMMARY}"
          const fs = require('fs');

          const report = JSON.parse(fs.readFileSync('output/auth-qa/auth-report.json', 'utf8'));
          const lines = [
            `- Result: ${report.pass ? 'PASS' : 'FAIL'}`,
            `- Base URL: ${report.baseUrl}`,
          ];

          const responsiveEntries = Object.entries(report.responsive || {});
          if (responsiveEntries.length > 0) {
            lines.push(
              '',
              '| Viewport | Width | Columns | Home CTA | Submit | Kakao | Google | Naver |',
              '| --- | ---: | ---: | --- | ---: | ---: | ---: | ---: |',
            );

            for (const [label, metric] of responsiveEntries) {
              lines.push(`| ${label} | ${metric.viewport.width}px | ${metric.stageColumns} | ${metric.homeButtonVisible ? 'shown' : 'hidden'} | ${metric.loginSubmitHeight ?? '-'} | ${metric.kakaoHeight ?? '-'} | ${metric.googleHeight ?? '-'} | ${metric.naverHeight ?? '-'} |`);
            }
          }

          const routeEntries = Object.entries(report.routes || {});
          if (routeEntries.length > 0) {
            lines.push('', '| Route | Path | Header | Submit | Status |', '| --- | --- | --- | ---: | --- |');
            for (const [label, metric] of routeEntries) {
              lines.push(`| ${label} | ${metric.path} | ${metric.header ?? '-'} | ${metric.submitHeight ?? '-'} | ${metric.statusText ?? '-'} |`);
            }
          }

          if (report.navigation?.home) {
            lines.push(
              '',
              '**Navigation**',
              `- Home CTA: ${report.navigation.home.path}${report.navigation.home.search}`,
              `- Login -> Signup: ${report.navigation.signup.path}${report.navigation.signup.search}`,
              `- Login -> Reset: ${report.navigation.passwordReset.path}${report.navigation.passwordReset.search}`,
              `- Reset -> Login: ${report.navigation.resetBack.path}${report.navigation.resetBack.search}`,
              `- Recovery -> Login: ${report.navigation.recoveryBack.path}${report.navigation.recoveryBack.search}`,
            );
          }

          if (report.focus?.testId || report.reducedMotion?.submitTransition) {
            lines.push(
              '',
              '**Accessibility Smoke**',
              `- Focus target: ${report.focus?.testId ?? '-'}`,
              `- Focus style: outline ${report.focus?.outlineWidth ?? '-'} ${report.focus?.outlineStyle ?? '-'}, shadow ${report.focus?.boxShadow ?? '-'}`,
              `- Reduced motion submit: ${report.reducedMotion?.submitTransition ?? '-'}`,
              `- Reduced motion provider: ${report.reducedMotion?.providerTransition ?? '-'}`,
              `- Reduced motion back link: ${report.reducedMotion?.backLinkTransition ?? '-'}`,
            );
          }

          if (report.errorMessage) {
            lines.push('', '**Error**', `- ${report.errorMessage}`);
          }

          if (report.failures?.length) {
            lines.push('', '**Failures**');
            for (const failure of report.failures) {
              lines.push(`- ${failure}`);
            }
          }

          if (report.cleanupWarnings?.length) {
            lines.push('', '**Cleanup Warnings**');
            for (const warning of report.cleanupWarnings) {
              lines.push(`- ${warning}`);
            }
          }

          if (report.readinessDiagnostics?.length) {
            lines.push('', '**Readiness Diagnostics**');
            for (const diagnostic of report.readinessDiagnostics) {
              const missingSelectors = (diagnostic.selectors || [])
                .filter((selector) => !selector.found)
                .map((selector) => selector.selector);
              const missingText = missingSelectors.length > 0 ? missingSelectors.join(', ') : 'none';
              lines.push(`- ${diagnostic.description}: ${diagnostic.path} (readyState=${diagnostic.readyState}, missing=${missingText})`);
            }
          }

          console.log(lines.join('\n'));
          NODE
        else
          echo "auth-summary.md not found" >> "${GITHUB_STEP_SUMMARY}"
        fi
      artifact_name: frontend-auth-qa-artifacts
      artifact_paths: |
        output/auth-qa/auth-report.json
        output/auth-qa/auth-summary.md
        output/auth-qa/auth-login-mobile.png
        output/auth-qa/auth-login-tablet.png
        output/auth-qa/auth-login-desktop.png
        output/auth-qa/auth-signup-desktop.png
        output/auth-qa/auth-password-reset-desktop.png
        output/auth-qa/auth-password-reset-confirm-desktop.png
        output/auth-qa/auth-account-recovery-desktop.png
        output/auth-qa/auth-chrome.log
      extra_artifact_name: frontend-auth-e2e-cypress-failures
      extra_artifact_paths: |
        cypress/screenshots/**
        cypress/videos/**

  landing-qa:
    needs: detect-changes
    if: ${{ (github.event_name == 'pull_request' && needs.detect-changes.outputs.landing_changed == 'true') || (github.event_name == 'workflow_dispatch' && (github.event.inputs.suite == 'landing' || github.event.inputs.suite == 'all')) }}
    uses: ./.github/workflows/_frontend-node-suite.yml
    permissions:
      contents: read
    with:
      timeout_minutes: 20
      env_exports: |
        VITE_SITE_URL=http://127.0.0.1:5176
        VITE_API_BASE_URL=/api
        VITE_MATE_REQUIRE_SOCIAL_VERIFICATION=false
        VITE_GA4_MEASUREMENT_ID=G-CI00000000
        VITE_GOOGLE_SITE_VERIFICATION=ciGoogleVerificationToken2026
        VITE_NAVER_SITE_VERIFICATION=ciNaverVerificationToken2026
        VITE_KAKAO_MAP_KEY=ciKakaoMapKey
      run_script: npm run qa:landing
      summary_script: |
        echo "### Frontend Landing QA" >> "${GITHUB_STEP_SUMMARY}"
        if [[ -f "output/landing-qa/landing-summary.md" ]]; then
          cat "output/landing-qa/landing-summary.md" >> "${GITHUB_STEP_SUMMARY}"
        elif [[ -f "output/landing-qa/landing-report.json" ]]; then
          node - <<'NODE' >> "${GITHUB_STEP_SUMMARY}"
          const fs = require('fs');

          const report = JSON.parse(fs.readFileSync('output/landing-qa/landing-report.json', 'utf8'));
          const lines = [
            `- Result: ${report.pass ? 'PASS' : 'FAIL'}`,
            `- Base URL: ${report.baseUrl}`,
          ];

          const metricEntries = Object.entries(report.metrics || {});
          if (metricEntries.length > 0) {
            lines.push(
              '',
              '| Viewport | Width | Hero | Panels | Mockup |',
              '| --- | ---: | --- | ---: | --- |',
            );

            for (const [label, metric] of metricEntries) {
              lines.push(`| ${label} | ${metric.viewport.width}px | ${metric.heroFontSize} | ${metric.visibleFeaturePanels} | ${metric.mockupVisible ? 'shown' : 'hidden'} |`);
            }
          }

          if (report.navigation) {
            lines.push(
              '',
              '**Navigation**',
              `- Header login: ${report.navigation.loginPath}`,
              `- Header start: ${report.navigation.headerCtaPath}`,
              `- Hero start: ${report.navigation.heroPrimaryPath}`,
              `- Secondary CTA scrollY: ${report.navigation.secondaryScroll.scrollY}, featuresTop: ${report.navigation.secondaryScroll.featuresTop}`,
            );
          }

          if (report.interaction) {
            lines.push(
              '',
              '**Interaction**',
              `- First feature after click: ${report.interaction.firstAfterClick}`,
              `- Fourth feature after click: ${report.interaction.fourthAfterClick}`,
              `- First feature after fourth click: ${report.interaction.firstAfterFourth}`,
              `- Mockup offset after scroll: ${report.interaction.mockupStyleAfter}`,
            );
          }

          if (report.reducedMotion) {
            lines.push(
              '',
              '**Reduced Motion**',
              `- Mockup transition: ${report.reducedMotion.mockupTransition}`,
              `- Feature card transition: ${report.reducedMotion.featureCardTransition}`,
              `- Hero button transition: ${report.reducedMotion.heroButtonTransition}`,
            );
          }

          if (report.errorMessage) {
            lines.push('', '**Error**', `- ${report.errorMessage}`);
          }

          if (report.failures?.length) {
            lines.push('', '**Failures**');
            for (const failure of report.failures) {
              lines.push(`- ${failure}`);
            }
          }

          if (report.cleanupWarnings?.length) {
            lines.push('', '**Cleanup Warnings**');
            for (const warning of report.cleanupWarnings) {
              lines.push(`- ${warning}`);
            }
          }

          if (report.readinessDiagnostics?.length) {
            lines.push('', '**Readiness Diagnostics**');
            for (const diagnostic of report.readinessDiagnostics) {
              const missingSelectors = (diagnostic.selectors || [])
                .filter((selector) => !selector.found)
                .map((selector) => selector.selector);
              const missingText = missingSelectors.length > 0 ? missingSelectors.join(', ') : 'none';
              lines.push(`- ${diagnostic.description}: ${diagnostic.path} (readyState=${diagnostic.readyState}, missing=${missingText})`);
            }
          }

          console.log(lines.join('\n'));
          NODE
        else
          echo "landing-summary.md not found" >> "${GITHUB_STEP_SUMMARY}"
        fi
      artifact_name: frontend-landing-qa-artifacts
      artifact_paths: |
        output/landing-qa/landing-report.json
        output/landing-qa/landing-summary.md
        output/landing-qa/landing-mobile.png
        output/landing-qa/landing-tablet.png
        output/landing-qa/landing-desktop.png
        output/landing-qa/landing-features.png
        output/landing-qa/landing-chrome.log

  landing-first-load:
    needs: detect-changes
    if: ${{ (github.event_name == 'pull_request' && needs.detect-changes.outputs.landing_changed == 'true') || (github.event_name == 'workflow_dispatch' && (github.event.inputs.suite == 'landing' || github.event.inputs.suite == 'all')) }}
    uses: ./.github/workflows/_frontend-node-suite.yml
    permissions:
      contents: read
    with:
      timeout_minutes: 25
      install_playwright: true
      env_exports: |
        VITE_SITE_URL=http://127.0.0.1:5176
        VITE_API_BASE_URL=/api
        VITE_MATE_REQUIRE_SOCIAL_VERIFICATION=false
        VITE_GA4_MEASUREMENT_ID=G-CI00000000
        VITE_GOOGLE_SITE_VERIFICATION=ciGoogleVerificationToken2026
        VITE_NAVER_SITE_VERIFICATION=ciNaverVerificationToken2026
        VITE_KAKAO_MAP_KEY=ciKakaoMapKey
      run_script: |
        npm run build
        LANDING_FIRST_LOAD_ITERATIONS=3 npm run qa:landing:first-load
      summary_script: |
        echo "### Frontend Landing First-Load Audit" >> "${GITHUB_STEP_SUMMARY}"
        if [[ -f "reports/landing-first-load-audit.md" ]]; then
          cat "reports/landing-first-load-audit.md" >> "${GITHUB_STEP_SUMMARY}"
        elif [[ -f "reports/landing-first-load-audit.json" ]]; then
          node - <<'NODE' >> "${GITHUB_STEP_SUMMARY}"
          const fs = require('fs');

          const report = JSON.parse(fs.readFileSync('reports/landing-first-load-audit.json', 'utf8'));
          const lines = [
            `- Status: ${report.status ?? 'unknown'}`,
            `- Iterations: ${report.iterations ?? '-'}`,
            `- Settle time: ${report.settleMs ?? '-'}ms`,
          ];

          if (report.landingCriticalAssets) {
            lines.push(
              `- Critical assets: ${report.landingCriticalAssets.totalBytes ?? '-'} / ${report.landingCriticalAssets.budgetBytes ?? '-'} bytes`,
            );
          }

          if (report.failures?.length) {
            lines.push('', '**Failures**');
            for (const failure of report.failures) {
              lines.push(`- ${failure}`);
            }
          }

          if (report.warnings?.length) {
            lines.push('', '**Warnings**');
            for (const warning of report.warnings) {
              lines.push(`- ${warning}`);
            }
          }

          console.log(lines.join('\n'));
          NODE
        else
          echo "landing-first-load audit reports not found" >> "${GITHUB_STEP_SUMMARY}"
        fi
      artifact_name: frontend-landing-first-load-artifacts
      artifact_paths: |
        reports/landing-first-load-audit.json
        reports/landing-first-load-audit.md
        reports/bundle-guard-report.json
        reports/dist-assets-report.json

