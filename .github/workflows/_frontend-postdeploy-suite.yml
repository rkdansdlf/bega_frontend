name: Frontend Postdeploy Suite Shared

on:
  workflow_call:
    inputs:
      working_directory:
        description: "Working directory for suite commands"
        required: false
        type: string
        default: "."
      timeout_minutes:
        description: "Job timeout in minutes"
        required: false
        type: number
        default: 20
      environment_name:
        description: "Deployment environment name"
        required: false
        type: string
        default: "production"
      environment_url:
        description: "Deployment environment URL"
        required: false
        type: string
        default: ""
      setup_node:
        description: "Install Node.js dependencies before running the suite"
        required: false
        type: boolean
        default: true
      api_base_url:
        description: "API base URL passed as data"
        required: false
        type: string
        default: ""
      frontend_origin:
        description: "Frontend origin passed as data"
        required: false
        type: string
        default: ""
      timeout_ms:
        required: false
        type: string
        default: "15000"
      run_dm_smoke:
        required: false
        type: string
        default: "false"
      base_url:
        required: false
        type: string
        default: ""
      expected_site_url:
        required: false
        type: string
        default: ""
      date:
        required: false
        type: string
        default: ""
      skip_signup:
        required: false
        type: string
        default: "false"
      verify_unfollow_reuse:
        required: false
        type: string
        default: "true"
      validate_script:
        description: "Input and secret validation script"
        required: true
        type: string
      run_script:
        description: "Main shell script for the suite"
        required: true
        type: string
      summary_script:
        description: "Shell script that appends suite details to GITHUB_STEP_SUMMARY"
        required: true
        type: string
      artifact_name:
        description: "Artifact name"
        required: false
        type: string
        default: ""
      artifact_paths:
        description: "Artifact paths"
        required: false
        type: string
        default: ""
    secrets:
      FRONTEND_REAL_DM_TARGET_EMAIL:
        required: false
      FRONTEND_REAL_DM_TARGET_PASSWORD:
        required: false
      FRONTEND_REAL_DM_TARGET_HANDLE:
        required: false
      FRONTEND_REAL_SMOKE_LOGIN_EMAIL:
        required: false
      FRONTEND_REAL_SMOKE_LOGIN_PASSWORD:
        required: false

jobs:
  run-suite:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    environment:
      name: ${{ inputs.environment_name }}
      url: ${{ inputs.environment_url }}
    env:
      # Keep dispatch data out of shell source and GITHUB_ENV file commands.
      API_BASE_URL: ${{ inputs.api_base_url }}
      FRONTEND_ORIGIN: ${{ inputs.frontend_origin }}
      TIMEOUT_MS: ${{ inputs.timeout_ms }}
      RUN_DM_SMOKE: ${{ inputs.run_dm_smoke }}
      BASE_URL: ${{ inputs.base_url }}
      EXPECTED_SITE_URL: ${{ inputs.expected_site_url }}
      DATE_INPUT: ${{ inputs.date }}
      SKIP_SIGNUP_INPUT: ${{ inputs.skip_signup }}
      SMOKE_API_BASE_URL: ${{ inputs.api_base_url }}
      SMOKE_FRONTEND_ORIGIN: ${{ inputs.frontend_origin }}
      DM_API_BASE_URL: ${{ inputs.api_base_url }}
      DM_FRONTEND_ORIGIN: ${{ inputs.frontend_origin }}
      VERIFY_UNFOLLOW_REUSE: ${{ inputs.verify_unfollow_reuse }}
      FRONTEND_REAL_DM_TARGET_EMAIL: ${{ secrets.FRONTEND_REAL_DM_TARGET_EMAIL }}
      FRONTEND_REAL_DM_TARGET_PASSWORD: ${{ secrets.FRONTEND_REAL_DM_TARGET_PASSWORD }}
      FRONTEND_REAL_DM_TARGET_HANDLE: ${{ secrets.FRONTEND_REAL_DM_TARGET_HANDLE }}
      FRONTEND_REAL_SMOKE_LOGIN_EMAIL: ${{ secrets.FRONTEND_REAL_SMOKE_LOGIN_EMAIL }}
      FRONTEND_REAL_SMOKE_LOGIN_PASSWORD: ${{ secrets.FRONTEND_REAL_SMOKE_LOGIN_PASSWORD }}
      DM_TARGET_EMAIL: ${{ secrets.FRONTEND_REAL_DM_TARGET_EMAIL }}
      DM_TARGET_PASSWORD: ${{ secrets.FRONTEND_REAL_DM_TARGET_PASSWORD }}
      DM_TARGET_HANDLE: ${{ secrets.FRONTEND_REAL_DM_TARGET_HANDLE }}
      SMOKE_LOGIN_EMAIL: ${{ secrets.FRONTEND_REAL_SMOKE_LOGIN_EMAIL }}
      SMOKE_LOGIN_PASSWORD: ${{ secrets.FRONTEND_REAL_SMOKE_LOGIN_PASSWORD }}
      DM_SENDER_EMAIL: ${{ secrets.FRONTEND_REAL_SMOKE_LOGIN_EMAIL }}
      DM_SENDER_PASSWORD: ${{ secrets.FRONTEND_REAL_SMOKE_LOGIN_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate workflow inputs
        working-directory: ${{ inputs.working_directory }}
        shell: bash
        env:
          VALIDATE_SCRIPT: ${{ inputs.validate_script }}
        run: |
          set -euo pipefail
          SCRIPT_FILE="$(mktemp)"
          printf '%s\n' "${VALIDATE_SCRIPT}" > "${SCRIPT_FILE}"
          sed -i -E 's/^[[:space:]]+NODE$/NODE/' "${SCRIPT_FILE}"
          bash -euo pipefail "${SCRIPT_FILE}"

      - name: Setup Node.js 22
        if: ${{ inputs.setup_node }}
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        if: ${{ inputs.setup_node }}
        working-directory: .
        run: npm ci

      - name: Run suite
        working-directory: ${{ inputs.working_directory }}
        shell: bash
        env:
          RUN_SCRIPT: ${{ inputs.run_script }}
        run: |
          set -euo pipefail
          SCRIPT_FILE="$(mktemp)"
          printf '%s\n' "${RUN_SCRIPT}" > "${SCRIPT_FILE}"
          sed -i -E 's/^[[:space:]]+NODE$/NODE/' "${SCRIPT_FILE}"
          bash -euo pipefail "${SCRIPT_FILE}"

      - name: Publish suite summary
        if: always()
        working-directory: ${{ inputs.working_directory }}
        shell: bash
        env:
          SUMMARY_SCRIPT: ${{ inputs.summary_script }}
        run: |
          set -euo pipefail
          SCRIPT_FILE="$(mktemp)"
          printf '%s\n' "${SUMMARY_SCRIPT}" > "${SCRIPT_FILE}"
          sed -i -E 's/^[[:space:]]+NODE$/NODE/' "${SCRIPT_FILE}"
          bash -euo pipefail "${SCRIPT_FILE}"

      - name: Upload suite artifacts
        if: ${{ always() && inputs.artifact_name != '' && inputs.artifact_paths != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.artifact_paths }}
          if-no-files-found: warn
          retention-days: 14
